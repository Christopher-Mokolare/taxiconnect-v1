<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxiConnect</title>
<meta name="theme-color" content="#10243a">
<link rel="manifest" href="/passenger-manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"
        integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"
        integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"
        integrity="sha384-1/m+A1jVWbD3yiK3/vtFvm1+LjK1WLpSoDY+Kaxppwn/yP9BVSgdHTNQVOjrzUO5"
        crossorigin="anonymous"></script>
<script src="/firebase-config.js"></script>
<script src="/js/app-common.js"></script>
<script src="/js/offline-queue.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,sans-serif;background:#f0f2f5;min-height:100vh}
  header{background:#1a1a2e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:16px}
  .btn-link{display:inline-block;text-decoration:none;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .screen{display:none;padding:12px;max-width:420px;margin:0 auto}
  .screen.active{display:block}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h3{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn-primary{background:#e94560;color:#fff}
  .btn-grey{background:#6c757d;color:#fff}
  input[type=tel]{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px}
  .otp-input{letter-spacing:8px;font-size:22px;text-align:center}
  .route-row{display:flex;gap:8px;margin-top:8px}
  .route-btn{flex:1;padding:16px 8px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-weight:700;cursor:pointer;text-align:center;line-height:1.5}
  .route-btn.sel{border-color:#e94560;background:#fff0f3;color:#e94560}
  .taxi-row{padding:10px 0;border-bottom:1px solid #f5f5f5}
  .taxi-row:last-child{border-bottom:none}
  .row-header{display:flex;justify-content:space-between;align-items:center}
  .badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600}
  .b-green{background:#d4edda;color:#155724}
  .b-orange{background:#fff3cd;color:#856404}
  .b-red{background:#f8d7da;color:#721c24}
  .meta{font-size:12px;color:#888;margin-top:4px}
  .counter-wrap{display:flex;align-items:center;gap:16px;margin-top:10px}
  .cbtn{width:40px;height:40px;border:none;border-radius:50%;font-size:20px;font-weight:700;cursor:pointer}
  .cbtn.minus{background:#f8d7da;color:#721c24}
  .cbtn.plus{background:#d4edda;color:#155724}
  .cval{font-size:28px;font-weight:700;min-width:40px;text-align:center}
  .alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;border-left:4px solid}
  .a-success{background:#d4edda;border-color:#28a745}
  .a-danger{background:#f8d7da;border-color:#dc3545}
  #recaptcha-container{margin-top:10px}
  .empty{color:#aaa;font-size:13px;text-align:center;padding:16px 0}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#e94560;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="/css/taxiconnect-theme.css">
</head>
<body>
<header>
  <h1>🚕 TaxiConnect</h1>
  <a class="btn-link" href="/" aria-label="Return to TaxiConnect home">← Home</a>
  <button class="btn-link" id="signOutBtn" onclick="signOut()" style="display:none">Sign Out</button>
</header>

<!-- AUTH -->
<div id="authScreen" class="screen active">
  <div class="card" style="margin-top:20px">
    <h3>Welcome</h3>
    <p style="font-size:13px;color:#666;margin-bottom:8px">No sign-in needed. Just tap your route to see available taxis.</p>
    <button class="btn btn-primary" onclick="enterApp()">🚕 Find a Taxi</button>
  </div>
</div>

<!-- APP -->
<div id="appScreen" class="screen">
  <div class="card" style="margin-top:10px">
    <h3>Where are you going?</h3>
    <div class="route-row">
      <button class="route-btn sel" id="pass-sun" onclick="selectRoute('SUN_CITY')">🏘 Sun City<br><small style="font-weight:400;font-size:12px">Sun Village</small></button>
      <button class="route-btn" id="pass-rust" onclick="selectRoute('RUSTENBURG')">🏙 Rustenburg<br><small style="font-weight:400;font-size:12px">Town</small></button>
    </div>
  </div>

  <div class="card">
    <h3>Available Taxis</h3>
    <div id="taxiList"><span class="spinner"></span></div>
  </div>

  <div class="card">
    <h3>Signal You're Waiting</h3>
    <p style="font-size:12px;color:#666">No taxi? Register your pickup point so the local operator can see demand.</p>
    <label for="pickupPointInput" style="display:block;font-size:12px;color:#666;margin-top:12px">Your pickup point</label>
    <input id="pickupPointInput" type="text" maxlength="80" autocomplete="off" placeholder="e.g. village shop or main road stop" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px" />
    <div class="counter-wrap">
      <button class="cbtn minus" onclick="adjGroup(-1)">−</button>
      <span class="cval" id="groupVal">1</span>
      <button class="cbtn plus" onclick="adjGroup(1)">+</button>
      <span style="font-size:13px;color:#666">people</span>
    </div>
    <button class="btn btn-primary" id="waitBtn" onclick="sendSignal()">📢 I'M WAITING — Register Demand</button>
    <button class="btn btn-grey" id="cancelBtn" onclick="cancelWaiting()" style="display:none">✖ Cancel Signal</button>
    <div id="waitStatus" class="alert a-success" style="display:none;margin-top:10px" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
if (!window.TAXICONNECT_CONFIGURED) throw new Error('Firebase Web App configuration is incomplete. See the setup warning above.');
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let selectedRoute = 'SUN_CITY', groupSize = 1;
let myWaitId = null, myWaitRef = null, myAssignedTaxiRef = null, allTaxis = {}, allConnections = {};
let pendingSignalId = null, flushingPendingSignals = false;

// ── Auth ──────────────────────────────────────────────────────────
let taxisSubscribed = false;

firebase.auth().onAuthStateChanged(async user => {
  if (!user) {
    try {
      await firebase.auth().signInAnonymously();
    } catch (error) {
      console.error('Anonymous authentication failed:', error);
      document.getElementById('taxiList').textContent = 'Connection unavailable. Please refresh and try again.';
    }
    return;
  }

  if (!taxisSubscribed) {
    taxisSubscribed = true;
    db.ref('taxis').on('value', snapshot => {
      allTaxis = snapshot.val() || {};
      renderTaxis();
    }, error => {
      console.error('Taxi subscription failed:', error);
      document.getElementById('taxiList').textContent = 'Could not load taxis. Please try again.';
    });
    db.ref('taxiConnections').on('value', snapshot => {
      allConnections = snapshot.val() || {};
      renderTaxis();
      refreshAssignedTaxiConnection();
    }, error => {
      console.error('Taxi connection subscription failed:', error);
      allConnections = {};
      renderTaxis();
      refreshAssignedTaxiConnection();
    });
  }

  try {
    const index = await db.ref('passengerWaiting/' + user.uid).once('value');
    const waitId = index.val();
    if (waitId) {
      const waiting = await db.ref('waitingPassengers/' + waitId).once('value');
      const record = waiting.val();
      if (record && record.passengerId === user.uid) {
        myWaitId = waitId;
      } else {
        myWaitId = null;
        await db.ref('passengerWaiting/' + user.uid).remove();
      }
    } else {
      myWaitId = null;
    }
    syncWaitControls();
    watchMyWaitingSignal();
    await flushPendingSignals();
  } catch (error) {
    console.error('Could not restore waiting signal:', error);
  }
});

function enterApp() {
  show('appScreen');
}

async function signOut() {
  if (myWaitId || pendingSignalId) await cancelWaiting();
  await firebase.auth().signOut();
  taxisSubscribed = false;
  db.ref('taxis').off('value');
  db.ref('taxiConnections').off('value');
  show('authScreen');
}

function showErr(m) { const e = document.getElementById('authError'); if(e){ e.textContent = m; e.style.display = 'block'; } }

// ── Taxis ─────────────────────────────────────────────────────────
function renderTaxis() {
  const el = document.getElementById('taxiList');
  const taxis = Object.entries(allTaxis).filter(([, taxi]) => taxi.route === selectedRoute);
  if (!taxis.length) {
    el.innerHTML = `<div class="alert a-danger">No taxi updates for <strong>${routeLabel(selectedRoute)}</strong> yet.<br><small>You can register your waiting demand below.</small></div>`;
    return;
  }
  el.innerHTML = taxis.map(([taxiId, taxi]) => {
    const sessions = allConnections[taxiId] || {};
    const connected = isTaxiFresh(taxi, sessions);
    const connectionLabel = taxiConnectionLabel(taxi, sessions);
    const seats = Math.max(0, Number(taxi.capacity || 14) - Number(taxi.passengersOnboard || 0));
    let badge;
    if (taxi.status === 'offline') badge = '<span class="badge b-red">OFFLINE</span>';
    else if (taxi.status === 'breakdown') badge = '<span class="badge b-red">BREAKDOWN</span>';
    else if (!connected) badge = '<span class="badge b-orange">UNVERIFIED</span>';
    else if (taxi.status === 'full' || seats === 0) badge = '<span class="badge b-red">FULL</span>';
    else badge = `<span class="badge b-green">${seats} seats free</span>`;
    const operational = taxi.status === 'offline' ? 'Driver has marked this taxi offline'
      : taxi.status === 'breakdown' ? 'Vehicle reported a breakdown'
      : !connected ? connectionLabel
      : taxi.status === 'full' ? 'Full — awaiting departure'
      : 'Loading passengers';
    return `<div class="taxi-row">
      <div class="row-header"><strong style="font-size:14px">${escapeHtml(taxi.driverName || 'Driver')}</strong>${badge}</div>
      <div class="meta">${operational} · ${Number(taxi.passengersOnboard || 0)}/${Number(taxi.capacity || 14)} onboard</div>
      <div class="meta">Last confirmed: ${timeAgo(taxi.lastUpdated)}</div>
    </div>`;
  }).join('');
}

// ── Route & group ─────────────────────────────────────────────────
function selectRoute(r) {
  selectedRoute = r;
  document.getElementById('pass-sun').classList.toggle('sel', r === 'SUN_CITY');
  document.getElementById('pass-rust').classList.toggle('sel', r === 'RUSTENBURG');
  renderTaxis();
}

function adjGroup(d) {
  groupSize = Math.max(1, Math.min(10, groupSize + d));
  document.getElementById('groupVal').textContent = groupSize;
}

// ── Waiting signal ────────────────────────────────────────────────
async function sendSignal() {
  const user = firebase.auth().currentUser;
  if (!user) {
    alert('Please wait for authentication to complete.');
    return;
  }
  const pickupPoint = String(document.getElementById('pickupPointInput').value || '').trim().replace(/\s+/g, ' ');
  if (pickupPoint.length < 2 || pickupPoint.length > 80) {
    alert('Enter a pickup point between 2 and 80 characters.');
    return;
  }
  const pending = {
    id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'signal-' + Date.now() + '-' + Math.random().toString(36).slice(2),
    passengerId: user.uid,
    route: selectedRoute,
    pickupPoint,
    groupSize,
    createdAt: Date.now(),
    expiresAt: Date.now() + 45 * 60 * 1000
  };
  // Persist before attempting the network write so a page reload cannot lose the request.
  await queuePassengerSignal(pending);
  if (navigator.onLine) await flushPendingSignals();
}

async function queuePassengerSignal(pending) {
  try {
    await TaxiConnectOfflineQueue.put(pending);
    pendingSignalId = pending.id;
    const status = document.getElementById('waitStatus');
    status.textContent = 'Saved on this phone — not sent yet. TaxiConnect will send it when the connection returns.';
    status.style.display = 'block';
    syncWaitControls();
  } catch (error) {
    console.error('Could not queue passenger request:', error);
    alert(error?.message || 'This browser cannot save an offline request. Please try again when connected.');
  }
}

async function publishPassengerSignal(user, pending) {
  if (!navigator.onLine) throw new Error('No internet connection yet.');
  if (pending.expiresAt <= Date.now()) throw new Error('This waiting request expired. Please send a new request.');

  const waitRef = db.ref('waitingPassengers').push();
  const indexRef = db.ref('passengerWaiting/' + user.uid);
  const currentIndexSnapshot = await indexRef.once('value');
  const currentIndex = currentIndexSnapshot.val();

  if (currentIndex) {
    const currentWaitSnapshot = await db.ref('waitingPassengers/' + currentIndex).once('value');
    const currentWait = currentWaitSnapshot.val();
    if (currentWait && waitingRequestExpiry(currentWait) > Date.now() && (currentWait.status === 'assigned' || isWaitingRequestActive(currentWait))) {
      myWaitId = currentIndex;
      if (pending.id) await TaxiConnectOfflineQueue.remove(pending.id);
      pendingSignalId = null;
      syncWaitControls();
      watchMyWaitingSignal();
      return;
    }
  }

  const claim = await indexRef.transaction(value => {
    if (value === null || value === currentIndex) return waitRef.key;
    return;
  });
  if (!claim.committed) {
    const latest = await indexRef.once('value');
    const existingId = latest.val();
    const existing = existingId ? (await db.ref('waitingPassengers/' + existingId).once('value')).val() : null;
    if (existing && waitingRequestExpiry(existing) > Date.now() && (existing.status === 'assigned' || isWaitingRequestActive(existing))) {
      myWaitId = existingId;
      if (pending.id) await TaxiConnectOfflineQueue.remove(pending.id);
      pendingSignalId = null;
      syncWaitControls();
      watchMyWaitingSignal();
      return;
    }
    throw new Error('Another waiting request is being registered. Please try again.');
  }

  try {
    await waitRef.set({
      route: pending.route,
      pickupPoint: pending.pickupPoint,
      groupSize: pending.groupSize,
      passengerId: user.uid,
      timestamp: firebase.database.ServerValue.TIMESTAMP,
      expiresAt: pending.expiresAt,
      status: 'waiting'
    });
  } catch (error) {
    const latest = await indexRef.once('value');
    if (latest.val() === waitRef.key) await indexRef.remove();
    throw error;
  }

  if (pending.id) await TaxiConnectOfflineQueue.remove(pending.id);
  myWaitId = waitRef.key;
  pendingSignalId = null;
  syncWaitControls();
  watchMyWaitingSignal();
}

async function flushPendingSignals() {
  const user = firebase.auth().currentUser;
  if (!user || flushingPendingSignals || !window.TaxiConnectOfflineQueue) return;
  flushingPendingSignals = true;
  try {
    const pendingItems = await TaxiConnectOfflineQueue.all();
    const ownPending = pendingItems.filter(item => item.passengerId === user.uid);
    if (ownPending.length) {
      pendingSignalId = ownPending[0].id;
      syncWaitControls();
      const status = document.getElementById('waitStatus');
      status.textContent = 'Saved on this phone — not sent yet. TaxiConnect will send it when the connection returns.';
      status.style.display = 'block';
    }
    if (!navigator.onLine) return;
    for (const pending of pendingItems) {
      if (pending.passengerId !== user.uid) continue;
      pendingSignalId = pending.id;
      syncWaitControls();
      if (pending.expiresAt <= Date.now()) {
        await TaxiConnectOfflineQueue.remove(pending.id);
        if (pendingSignalId === pending.id) pendingSignalId = null;
        continue;
      }
      try {
        await publishPassengerSignal(user, pending);
      } catch (error) {
        console.warn('Offline passenger request is still pending:', error);
        break;
      }
    }
    if (pendingSignalId) {
      const remaining = await TaxiConnectOfflineQueue.all();
      if (!remaining.some(item => item.id === pendingSignalId)) pendingSignalId = null;
    }
    syncWaitControls();
  } catch (error) {
    console.error('Could not sync offline passenger requests:', error);
  } finally {
    flushingPendingSignals = false;
  }
}

window.addEventListener('online', flushPendingSignals);

async function cancelWaiting() {
  if (pendingSignalId) {
    await TaxiConnectOfflineQueue.remove(pendingSignalId);
    pendingSignalId = null;
    syncWaitControls();
    renderWaitStatus(null);
    return;
  }
  if (!myWaitId) return;

  try {
    const user = firebase.auth().currentUser;
    if (!user) throw new Error('Sign in before cancelling your signal.');
    const ref = db.ref('waitingPassengers/' + myWaitId);
    const snapshot = await ref.once('value');
    const record = snapshot.val();
    if (!record) {
      myWaitId = null;
      syncWaitControls();
      return;
    }
    if (record.passengerId !== user.uid) throw new Error('You can only cancel your own waiting signal.');
    const updates = {};
    updates['waitingPassengers/' + myWaitId] = null;
    const index = await db.ref('passengerWaiting/' + user.uid).once('value');
    if (index.val() === myWaitId) updates['passengerWaiting/' + user.uid] = null;
    await db.ref().update(updates);
    myWaitId = null;
    if (myWaitRef) myWaitRef.off('value');
    myWaitRef = null;
    syncWaitControls();
    renderWaitStatus(null);
  } catch (error) {
    console.error('cancelWaiting failed:', error);
    alert(error?.message || 'Could not cancel waiting signal.');
  }
}

async function renderWaitStatus(record) {
  const el = document.getElementById('waitStatus');
  if (!record) {
    if (myAssignedTaxiRef) myAssignedTaxiRef.off('value');
    myAssignedTaxiRef = null;
    el.style.display = 'none';
    el.textContent = '';
    return;
  }
  el.style.display = 'block';
  if (record.status === 'assigned' && record.assignedTaxiId) {
    const path = 'taxis/' + record.assignedTaxiId;
    if (!myAssignedTaxiRef || myAssignedTaxiRef.toString() !== db.ref(path).toString()) {
      if (myAssignedTaxiRef) myAssignedTaxiRef.off('value');
      myAssignedTaxiRef = db.ref(path);
      myAssignedTaxiRef.on('value', snapshot => {
        const taxi = snapshot.val();
        if (!taxi || taxi.status === 'offline' || taxi.status === 'breakdown') {
          el.textContent = '⚠️ Your assigned taxi is unavailable. The local operator can return your group to the waiting queue.';
          return;
        }
        el.textContent = '🚕 Taxi assigned: ' + (taxi.driverName || 'Driver') +
          ' · ' + routeLabel(taxi.route) + ' · ' +
          Math.max(0, Number(taxi.capacity || 0) - Number(taxi.passengersOnboard || 0)) + ' seats available.';
      }, error => {
        console.error('Could not watch assigned taxi:', error);
        el.textContent = 'A taxi has been assigned. Please keep this page open for updates.';
      });
    }
    return;
  }
  if (myAssignedTaxiRef) myAssignedTaxiRef.off('value');
  myAssignedTaxiRef = null;
  el.textContent = '📢 Your waiting signal is active. The local operator can see your request.';
}

async function refreshAssignedTaxiConnection() {
  if (!myWaitId) return;
  try {
    const waitSnapshot = await db.ref('waitingPassengers/' + myWaitId).once('value');
    const request = waitSnapshot.val();
    if (!request || request.status !== 'assigned' || !request.assignedTaxiId) return;
    const taxiSnapshot = await db.ref('taxis/' + request.assignedTaxiId).once('value');
    const taxi = taxiSnapshot.val();
    const status = document.getElementById('waitStatus');
    if (!taxi || taxi.status === 'offline' || taxi.status === 'breakdown') return;
    if (!isTaxiFresh(taxi, allConnections[request.assignedTaxiId])) {
      status.textContent = '⚠️ A taxi was assigned, but its connection is unverified. Last confirmed ' + timeAgo(taxi.lastUpdated) + '. Please wait for the operator to confirm.';
    } else {
      status.textContent = '🚕 Taxi assigned: ' + (taxi.driverName || 'Driver') + ' · ' + routeLabel(taxi.route) + ' · ' +
        Math.max(0, Number(taxi.capacity || 0) - Number(taxi.passengersOnboard || 0)) + ' seats available.';
    }
    status.style.display = 'block';
  } catch (error) {
    console.warn('Could not refresh assigned taxi connection state:', error);
  }
}

function syncWaitControls() {
  const active = Boolean(myWaitId || pendingSignalId);
  document.getElementById('waitBtn').style.display = active ? 'none' : 'block';
  document.getElementById('cancelBtn').style.display = active ? 'block' : 'none';
}

function watchMyWaitingSignal() {
  if (myWaitRef) myWaitRef.off('value');
  myWaitRef = null;
  if (myAssignedTaxiRef) myAssignedTaxiRef.off('value');
  myAssignedTaxiRef = null;
  const user = firebase.auth().currentUser;
  if (!user || !myWaitId) return;

  const watchedId = myWaitId;
  myWaitRef = db.ref('waitingPassengers/' + watchedId);
  myWaitRef.on('value', async snapshot => {
    const record = snapshot.val();
    if (!record || record.passengerId !== user.uid || (record.status === 'waiting' && !isWaitingRequestActive(record))) {
      if (myWaitId === watchedId) myWaitId = null;
      syncWaitControls();
      renderWaitStatus(null);
      if (myWaitRef) myWaitRef.off('value');
      myWaitRef = null;
      return;
    }
    await renderWaitStatus(record);
  });
}

function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
</script>
</body>
</html>
