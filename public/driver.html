<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxiConnect — Driver</title>
<meta name="theme-color" content="#10243a">
<link rel="manifest" href="/driver-manifest.json">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"
        integrity="sha384-sEVIly94UBRLKWdkYoPpSG7GD/e79YHMrxVyZaOk712Ga7+EAw6w1EFi+xBzBdd+"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"
        integrity="sha384-EkqK+ezBWJuvO3hfrSx2iVqr3YQbhmnzn8kPhOpBZ+0GMVU5oGSgptwIu8D84HjE"
        crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"
        integrity="sha384-1/m+A1jVWbD3yiK3/vtFvm1+LjK1WLpSoDY+Kaxppwn/yP9BVSgdHTNQVOjrzUO5"
        crossorigin="anonymous"></script>
<script src="/firebase-config.js"></script>
<script src="/js/app-common.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,sans-serif;background:#f0f2f5;min-height:100vh}
  header{background:#1a1a2e;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header h1{font-size:16px}
  .btn-link{display:inline-block;text-decoration:none;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .screen{display:none;padding:12px;max-width:420px;margin:0 auto}
  .screen.active{display:block}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .card h3{font-size:12px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
  .btn-green{background:#28a745;color:#fff}
  .btn-red{background:#dc3545;color:#fff}
  .btn-blue{background:#007bff;color:#fff}
  input[type=tel],input[type=text]{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px}
  .otp-input{letter-spacing:8px;font-size:22px;text-align:center}
  .route-row{display:flex;gap:8px;margin-top:8px}
  .route-btn{flex:1;padding:14px 8px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:13px;font-weight:700;cursor:pointer;text-align:center;line-height:1.4}
  .route-btn.sel{border-color:#28a745;background:#f0fff4;color:#155724}
  .counter-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
  .cbtn{width:44px;height:44px;border:none;border-radius:50%;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .cbtn.minus{background:#f8d7da;color:#721c24}
  .cbtn.plus{background:#d4edda;color:#155724}
  .cval{font-size:32px;font-weight:700;min-width:48px;text-align:center}
  .needs-box{border-radius:10px;padding:14px;text-align:center;margin-top:10px}
  .needs-box .num{font-size:36px;font-weight:700}
  .needs-box .lbl{font-size:12px;margin-top:2px}
  .nb-loading{background:#fff3cd;color:#856404}
  .nb-full{background:#d4edda;color:#155724}
  .alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;border-left:4px solid}
  .a-success{background:#d4edda;border-color:#28a745}
  .a-danger{background:#f8d7da;border-color:#dc3545}
  .summon-banner{background:#e94560;color:#fff;padding:14px;border-radius:10px;margin-bottom:10px;font-weight:600;font-size:14px;display:none}
  #recaptcha-container{margin-top:10px}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #ddd;border-top-color:#28a745;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .password-row{display:flex;gap:8px;align-items:stretch;margin-top:6px}
  .password-row input{flex:1;min-width:0;margin-top:0!important}
  .password-toggle{border:1px solid #cbd5e1;background:#f8fafc;color:#10243a;border-radius:9px;padding:0 13px;font-weight:700;cursor:pointer}
</style>
<link rel="stylesheet" href="/css/taxiconnect-theme.css">
</head>
<body>
<header>
  <h1>🚗 TaxiConnect — Driver</h1>
  <a class="btn-link" href="/" aria-label="Return to TaxiConnect home">← Home</a>
  <button class="btn-link" id="signOutBtn" onclick="signOut()" style="display:none">Sign Out</button>
</header>

<!-- AUTH -->
<div id="authScreen" class="screen active">
  <div class="card" style="margin-top:20px">
    <h3>Driver sign in</h3>
    <p style="font-size:13px;color:#666;margin-bottom:4px">Use your approved driver account to access the app.</p>
    <label for="emailInput" style="display:block;font-size:12px;color:#666;margin-top:8px">Email address</label>
    <input type="email" id="emailInput" autocomplete="username" placeholder="name@example.com" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-top:6px" />
    <label for="passwordInput" style="display:block;font-size:12px;color:#666;margin-top:10px">Password</label>
    <div class="password-row"><input type="password" id="passwordInput" autocomplete="current-password" placeholder="Your password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px" /><button class="password-toggle" type="button" aria-controls="passwordInput" aria-pressed="false" onclick="togglePasswordVisibility()">Show</button></div>
    <button class="btn btn-green" onclick="staffLogin()">Enter App</button>
    <button type="button" class="btn" style="background:transparent;color:#536174;border:1px solid #d5dce5;margin-top:6px" onclick="resetPassword()">Forgot password?</button>
  </div>
  <div id="authError" class="alert a-danger" style="display:none;margin-top:10px"></div>
</div>

<!-- APP -->
<div id="appScreen" class="screen">
  <div id="summonBanner" class="summon-banner"></div>

  <div id="checkInCard" class="card" style="margin-top:10px">
    <h3>Go Live</h3>
    <div class="route-row">
      <button class="route-btn sel" id="drv-sun" onclick="selectRoute('SUN_CITY')">🏘 Sun City<br><small>Sun Village</small></button>
      <button class="route-btn" id="drv-rust" onclick="selectRoute('RUSTENBURG')">🏙 Rustenburg<br><small>Town</small></button>
    </div>
    <label style="font-size:12px;color:#666;margin-top:12px;display:block">Taxi Capacity</label>
    <div class="counter-wrap">
      <button class="cbtn minus" onclick="adjCap(-1)">−</button>
      <span class="cval" id="capVal">14</span>
      <button class="cbtn plus" onclick="adjCap(1)">+</button>
    </div>
    <label style="font-size:12px;color:#666;margin-top:12px;display:block">Passengers Already Onboard</label>
    <div class="counter-wrap">
      <button class="cbtn minus" onclick="adjOnboard(-1)">−</button>
      <span class="cval" id="onboardVal">0</span>
      <button class="cbtn plus" onclick="adjOnboard(1)">+</button>
    </div>
    <div class="needs-box nb-loading" id="previewBox">
      <div class="num" id="previewNum">14</div>
      <div class="lbl">passengers needed</div>
    </div>
    <button class="btn btn-green" onclick="goLive()">✅ GO LIVE</button>
  </div>

  <div id="liveCard" class="card" style="display:none;margin-top:10px">
    <h3>You Are Live</h3>
    <div id="liveInfo"></div>
    <label style="font-size:12px;color:#666;margin-top:14px;display:block;font-weight:600">Update Passengers Onboard</label>
    <div class="counter-wrap" style="margin-top:8px">
      <button class="cbtn minus" onclick="adjLive(-1)">−</button>
      <span class="cval" id="liveVal">0</span>
      <button class="cbtn plus" onclick="adjLive(1)">+</button>
    </div>
    <div class="needs-box nb-loading" id="liveNeedsBox">
      <div class="num" id="liveNeedsNum">14</div>
      <div class="lbl" id="liveNeedsLbl">passengers needed</div>
    </div>
    <button class="btn btn-blue" onclick="updatePassengers()">🔄 Update Count</button>
    <button class="btn btn-red" onclick="goOffline()" style="margin-top:8px">🔴 Go Offline</button>
  </div>
</div>

<script>
if (!window.TAXICONNECT_CONFIGURED || !window.FIREBASE_CONFIG) throw new Error('Firebase Web App configuration is incomplete. Check /firebase-config.js.');
if (!window.firebase || typeof firebase.initializeApp !== 'function') throw new Error('Firebase SDK failed to load. Check the Firebase CDN scripts and browser network connection.');
const defaultFirebaseApp = firebase.apps.find(app => app.name === '[DEFAULT]')
  || firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database(defaultFirebaseApp);
let selectedRoute = 'SUN_CITY', capacity = 14, onboard = 0, liveOnboard = 0;
let myTaxiId = null, myCapacity = 14, summonsRef = null, heartbeatTimer = null;
let connectionRef = null, connectionSessionId = null, connectionListener = null, demandRef = null, currentRouteDemand = {}, demandRefreshTimer = null;

// ── Auth ──────────────────────────────────────────────────────────
let driverName = '';

function togglePasswordVisibility() {
  const input = document.getElementById('passwordInput');
  const button = document.querySelector('.password-toggle');
  const visible = input.type === 'password';
  input.type = visible ? 'text' : 'password';
  button.textContent = visible ? 'Hide' : 'Show';
  button.setAttribute('aria-pressed', String(visible));
}

// Driver access is verified using server-issued Firebase custom claims.

async function staffLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;

  if (!email || !password) {
    showErr('Enter your driver email and password.');
    return;
  }

  try {
    const credential = await firebase.auth().signInWithEmailAndPassword(email, password);
    const token = await credential.user.getIdTokenResult(true);
    if (token.claims.isDriver !== true) {
      await firebase.auth().signOut();
      throw new Error('This account has not been assigned the driver role.');
    }

    driverName = credential.user.displayName || email.split('@')[0];
    sessionStorage.setItem('tc_role', 'driver');
    sessionStorage.setItem('tc_name', driverName);
    document.getElementById('signOutBtn').style.display = 'block';
    show('appScreen');
    requestNotificationPermission();
    listenForSummons();
    await restoreMyTaxi();
  } catch (err) {
    console.error('Driver sign in failed:', err);
    showErr(err?.message || 'Could not sign in.');
  }
}

async function resetPassword() {
  const email = document.getElementById('emailInput').value.trim();
  if (!email) {
    showErr('Enter your staff email address first.');
    return;
  }
  try {
    await firebase.auth().sendPasswordResetEmail(email);
    alert('Password reset instructions have been sent if this account exists.');
  } catch (error) {
    console.error('Password reset request failed:', error);
    alert('If the account exists, password reset instructions will be sent.');
  }
}

async function signOut() {
  try {
    if (myTaxiId) await goOffline();
  } catch (error) {
    console.error('Could not take taxi offline during sign-out:', error);
  }
  sessionStorage.removeItem('tc_role');
  sessionStorage.removeItem('tc_name');
  if (demandRef) demandRef.off('value');
  demandRef = null;
  if (demandRefreshTimer) window.clearInterval(demandRefreshTimer);
  demandRefreshTimer = null;
  await firebase.auth().signOut();
  document.getElementById('signOutBtn').style.display = 'none';
  show('authScreen');
}

function showErr(m) { const e = document.getElementById('authError'); e.textContent = m; e.style.display = 'block'; }

// Restore only a signed-in Firebase staff session with driver claims.
firebase.auth().onAuthStateChanged(async user => {
  if (sessionStorage.getItem('tc_role') !== 'driver') return;
  if (!user) {
    sessionStorage.removeItem('tc_role');
    sessionStorage.removeItem('tc_name');
    show('authScreen');
    return;
  }
  try {
    const token = await user.getIdTokenResult();
    if (token.claims.isDriver !== true) throw new Error('Driver role claim missing');
    driverName = sessionStorage.getItem('tc_name') || user.displayName || 'Driver';
    document.getElementById('signOutBtn').style.display = 'block';
    show('appScreen');
    requestNotificationPermission();
    listenForSummons();
    await restoreMyTaxi();
  } catch (error) {
    console.error('Driver session restore failed:', error);
    await firebase.auth().signOut();
    sessionStorage.removeItem('tc_role');
    sessionStorage.removeItem('tc_name');
    show('authScreen');
  }
});

async function restoreMyTaxi() {
  const user = firebase.auth().currentUser;
  if (!user) return;

  const snapshot = await db.ref('taxis')
    .orderByChild('driverId')
    .equalTo(user.uid)
    .limitToFirst(1)
    .once('value');
  const entry = Object.entries(snapshot.val() || {})[0];
  if (!entry) return;

  const [taxiId, taxi] = entry;
  if (taxi.status === 'offline') return;
  myTaxiId = taxiId;
  myCapacity = Number(taxi.capacity || 14);
  capacity = myCapacity;
  liveOnboard = Number(taxi.passengersOnboard || 0);
  onboard = liveOnboard;
  selectedRoute = taxi.route || 'SUN_CITY';

  document.getElementById('capVal').textContent = capacity;
  document.getElementById('onboardVal').textContent = onboard;
  document.getElementById('liveVal').textContent = liveOnboard;
  document.getElementById('liveNeedsNum').textContent = Math.max(0, myCapacity - liveOnboard);
  document.getElementById('liveNeedsLbl').textContent = liveOnboard >= myCapacity ? 'TAXI IS FULL' : 'passengers needed';
  document.getElementById('liveNeedsBox').className = 'needs-box ' + (liveOnboard >= myCapacity ? 'nb-full' : 'nb-loading');
  document.getElementById('liveInfo').innerHTML = '<div class="alert a-success">🟢 You are live on <strong>' + escapeHtml(routeLabel(selectedRoute)) + '</strong><br>Capacity: ' + myCapacity + '</div>';
  document.getElementById('checkInCard').style.display = 'none';
  document.getElementById('liveCard').style.display = 'block';
  document.getElementById('drv-sun').classList.toggle('sel', selectedRoute === 'SUN_CITY');
  document.getElementById('drv-rust').classList.toggle('sel', selectedRoute === 'RUSTENBURG');
  startHeartbeat();
}

// ── Summon listener ───────────────────────────────────────────────
function listenForSummons() {
  if (summonsRef) summonsRef.off('value');
  summonsRef = db.ref(`summons/${selectedRoute}`);
  listenForRouteDemand();
  summonsRef.on('value', snap => {
    const s = snap.val();
    if (!s || Date.now() - s.timestamp > 5 * 60 * 1000) return;
    const banner = document.getElementById('summonBanner');
    banner.textContent = `🚨 Conductor needs drivers → ${ROUTES[selectedRoute].label}! ${s.count} passengers waiting.`;
    banner.style.display = 'block';
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('🚨 TaxiConnect', { body: `${s.count} passengers waiting for ${ROUTES[selectedRoute].label}. Go live now!` });
    }
    setTimeout(() => { banner.style.display = 'none'; }, 30000);
  });
}

function listenForRouteDemand() {
  if (demandRef) demandRef.off('value');
  demandRef = db.ref('routeDemand');
  demandRef.on('value', snapshot => {
    currentRouteDemand = snapshot.val() || {};
    renderRouteDemand();
  }, error => {
    console.error('Could not load passenger demand:', error);
  });
  if (!demandRefreshTimer) demandRefreshTimer = window.setInterval(renderRouteDemand, 30000);
}

function renderRouteDemand() {
  const banner = document.getElementById('summonBanner');
  const groups = Object.values(currentRouteDemand).filter(item =>
    item.route === selectedRoute && Number(item.expiresAt || 0) > Date.now()
  );
  if (!groups.length) {
    if (banner.dataset.kind === 'demand') banner.style.display = 'none';
    return;
  }
  const total = groups.reduce((sum, item) => sum + Number(item.people || 0), 0);
  const stops = groups.map(item => item.pickupPoint + ': ' + item.people).join(' · ');
  banner.dataset.kind = 'demand';
  banner.textContent = '📍 ' + total + ' passengers waiting for ' + routeLabel(selectedRoute) + ' — ' + stops;
  banner.style.display = 'block';
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}

// ── Counters ──────────────────────────────────────────────────────
function adjCap(d) {
  capacity = Math.max(1, Math.min(22, capacity + d));
  onboard = Math.min(onboard, capacity);
  document.getElementById('capVal').textContent = capacity;
  document.getElementById('onboardVal').textContent = onboard;
  updatePreview();
}

function adjOnboard(d) {
  onboard = Math.max(0, Math.min(capacity, onboard + d));
  document.getElementById('onboardVal').textContent = onboard;
  updatePreview();
}

function adjLive(d) {
  liveOnboard = Math.max(0, Math.min(myCapacity, liveOnboard + d));
  document.getElementById('liveVal').textContent = liveOnboard;
  const needed = myCapacity - liveOnboard;
  document.getElementById('liveNeedsNum').textContent = needed;
  const box = document.getElementById('liveNeedsBox');
  if (needed <= 0) { box.className = 'needs-box nb-full'; document.getElementById('liveNeedsLbl').textContent = 'TAXI IS FULL'; }
  else { box.className = 'needs-box nb-loading'; document.getElementById('liveNeedsLbl').textContent = 'passengers needed'; }
}

function updatePreview() {
  const needed = capacity - onboard;
  document.getElementById('previewNum').textContent = needed;
  document.getElementById('previewBox').className = `needs-box ${needed <= 0 ? 'nb-full' : 'nb-loading'}`;
}

function selectRoute(r) {
  selectedRoute = r;
  document.getElementById('drv-sun').classList.toggle('sel', r === 'SUN_CITY');
  document.getElementById('drv-rust').classList.toggle('sel', r === 'RUSTENBURG');
  if (firebase.auth().currentUser && sessionStorage.getItem('tc_role') === 'driver') { listenForSummons(); renderRouteDemand(); }
}

// ── Go Live / Offline ─────────────────────────────────────────────
async function goLive() {
  if (myTaxiId) return;
  try {
    const user = firebase.auth().currentUser;
    if (!user) throw new Error('Sign in before going live.');
    const token = await user.getIdTokenResult();
    if (token.claims.isDriver !== true) throw new Error('Driver access required.');

    const existing = await db.ref('taxis').orderByChild('driverId').equalTo(user.uid).once('value');
    const existingEntry = Object.entries(existing.val() || {})[0];
    const updates = {};
    const taxiRef = existingEntry ? db.ref('taxis/' + existingEntry[0]) : db.ref('taxis').push();
    myTaxiId = taxiRef.key;
    myCapacity = capacity;
    liveOnboard = onboard;
    updates['taxis/' + myTaxiId] = {
      driverId: user.uid,
      driverName: driverName || user.displayName || (user.email ? user.email.split('@')[0] : 'Driver'),
      route: selectedRoute,
      capacity,
      passengersOnboard: onboard,
      status: onboard >= capacity ? 'full' : 'loading',
      lastUpdated: firebase.database.ServerValue.TIMESTAMP
    };
    updates['drivers/' + user.uid] = {
      displayName: driverName || user.displayName || (user.email ? user.email.split('@')[0] : 'Driver'),
      lastSeen: firebase.database.ServerValue.TIMESTAMP
    };
    await db.ref().update(updates);

    document.getElementById('liveVal').textContent = liveOnboard;
    document.getElementById('liveNeedsNum').textContent = myCapacity - liveOnboard;
    document.getElementById('liveNeedsLbl').textContent = liveOnboard >= myCapacity ? 'TAXI IS FULL' : 'passengers needed';
    document.getElementById('liveNeedsBox').className = 'needs-box ' + (liveOnboard >= myCapacity ? 'nb-full' : 'nb-loading');
    document.getElementById('liveInfo').innerHTML = '<div class="alert a-success">🟢 Live on <strong>' + escapeHtml(routeLabel(selectedRoute)) + '</strong><br>Capacity: ' + myCapacity + '</div>';
    document.getElementById('checkInCard').style.display = 'none';
    document.getElementById('liveCard').style.display = 'block';
    startHeartbeat();
  } catch (err) {
    myTaxiId = null;
    console.error(err);
    alert(err.message || 'Could not go live.');
  }
}

async function updatePassengers() {
  if (!myTaxiId) return;
  try {
    const ref = db.ref('taxis/' + myTaxiId);
    const snapshot = await ref.once('value');
    const taxi = snapshot.val();
    if (!taxi || taxi.driverId !== firebase.auth().currentUser.uid) {
      throw new Error('This taxi session is no longer active.');
    }
    const status = liveOnboard >= myCapacity ? 'full' : 'loading';
    await ref.update({
      passengersOnboard: liveOnboard,
      status,
      lastUpdated: firebase.database.ServerValue.TIMESTAMP
    });
    if (status === 'full') {
      document.getElementById('liveInfo').innerHTML = '<div class="alert a-success">✅ Taxi is FULL — ready to depart!</div>';
    }
  } catch (err) {
    console.error(err);
    alert(err.message || 'Could not update passengers.');
  }
}

async function goOffline() {
  if (!myTaxiId) return;
  const taxiId = myTaxiId;
  const ref = db.ref('taxis/' + taxiId);
  const snapshot = await ref.once('value');
  const taxi = snapshot.val();
  if (taxi && taxi.driverId !== firebase.auth().currentUser?.uid) {
    throw new Error('You do not own this taxi.');
  }
  if (taxi) await ref.update({ status: 'offline', lastUpdated: firebase.database.ServerValue.TIMESTAMP });
  await stopTaxiConnection();
  stopHeartbeat();
  myTaxiId = null;
  onboard = 0;
  liveOnboard = 0;
  document.getElementById('onboardVal').textContent = '0';
  updatePreview();
  document.getElementById('checkInCard').style.display = 'block';
  document.getElementById('liveCard').style.display = 'none';
}

async function registerTaxiConnection() {
  const user = firebase.auth().currentUser;
  if (!user || !myTaxiId) return;
  if (!connectionSessionId) connectionSessionId = db.ref('taxiConnections/' + myTaxiId).push().key;
  if (!connectionRef) connectionRef = db.ref('taxiConnections/' + myTaxiId + '/' + connectionSessionId);
  if (!connectionListener) connectionListener = db.ref('.info/connected');

  connectionListener.off('value');
  connectionListener.on('value', async snapshot => {
    if (snapshot.val() !== true || !connectionRef) return;
    try {
      // Register the server-side cleanup before publishing this session as connected.
      await connectionRef.onDisconnect().remove();
      await connectionRef.set({
        connectedAt: firebase.database.ServerValue.TIMESTAMP,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (error) {
      console.error('Could not register taxi connection presence:', error);
    }
  });
}

async function stopTaxiConnection() {
  if (connectionListener) connectionListener.off('value');
  connectionListener = null;
  if (connectionRef) {
    try {
      await connectionRef.onDisconnect().cancel();
      await connectionRef.remove();
    } catch (error) {
      console.error('Could not clear taxi connection presence:', error);
    }
  }
  connectionRef = null;
  connectionSessionId = null;
}

function startHeartbeat() {
  stopHeartbeat();
  if (!myTaxiId) return;
  registerTaxiConnection();
  heartbeatTimer = window.setInterval(async () => {
    renderRouteDemand();
    const user = firebase.auth().currentUser;
    if (!user || !myTaxiId) return;
    try {
      const ref = db.ref('taxis/' + myTaxiId);
      const snapshot = await ref.once('value');
      const taxi = snapshot.val();
      if (!taxi || taxi.driverId !== user.uid) {
        stopHeartbeat();
        await stopTaxiConnection();
        myTaxiId = null;
        document.getElementById('checkInCard').style.display = 'block';
        document.getElementById('liveCard').style.display = 'none';
        return;
      }
      const writes = [ref.update({ lastUpdated: firebase.database.ServerValue.TIMESTAMP }),
        db.ref('drivers/' + user.uid + '/lastSeen').set(firebase.database.ServerValue.TIMESTAMP)];
      if (connectionRef) writes.push(connectionRef.update({ lastSeen: firebase.database.ServerValue.TIMESTAMP }));
      await Promise.all(writes);
    } catch (error) {
      console.error('Driver heartbeat failed:', error);
    }
  }, 30 * 1000);
}

function stopHeartbeat() {
  if (heartbeatTimer) window.clearInterval(heartbeatTimer);
  heartbeatTimer = null;
}

// ── Helpers ───────────────────────────────────────────────────────
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
</script>
