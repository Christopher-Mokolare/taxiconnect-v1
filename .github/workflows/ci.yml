name: TaxiConnect V1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxiconnect-v1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate V1 application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Check Cloud Functions syntax
        run: npm run check
        working-directory: functions

      - name: Validate Firebase configuration and web scripts
        run: node scripts/validate.js
