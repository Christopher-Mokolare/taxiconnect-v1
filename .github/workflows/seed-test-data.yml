name: Seed TaxiConnect development test data

on:
  workflow_dispatch:
    inputs:
      confirm_seed:
        description: "Explicitly confirm creation of fake users and sample taxis in taxiconnect-dev"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: taxiconnect-dev-test-seed
  cancel-in-progress: false

jobs:
  seed:
    name: Create development-only test accounts and taxis
    if: ${{ inputs.confirm_seed == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Verify required GitHub secrets and target project
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAXICONNECT_DEV }}
          TEST_PASSWORD: ${{ secrets.TAXICONNECT_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_TAXICONNECT_DEV."
            exit 1
          fi
          if [[ -z "$TEST_PASSWORD" || ${#TEST_PASSWORD} -lt 12 ]]; then
            echo "::error::Missing TAXICONNECT_TEST_PASSWORD secret or password is shorter than 12 characters."
            exit 1
          fi
          PROJECT_ID="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | jq -r '.project_id // empty')"
          if [[ "$PROJECT_ID" != "taxiconnect-dev" ]]; then
            echo "::error::The service account secret must belong to taxiconnect-dev. No changes were made."
            exit 1
          fi
          echo "Confirmed target project: taxiconnect-dev"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Authenticate to the development Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAXICONNECT_DEV }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Seed fake staff accounts and sample taxis
        env:
          GCLOUD_PROJECT: taxiconnect-dev
          TAXICONNECT_ALLOW_TEST_SEED: "1"
          TAXICONNECT_TEST_PASSWORD: ${{ secrets.TAXICONNECT_TEST_PASSWORD }}
        run: npm run seed:test --prefix functions

      - name: Record result
        if: success()
        run: |
          {
            echo "## TaxiConnect development test data"
            echo "- Target: `taxiconnect-dev`"
            echo "- Driver accounts: `driver1@taxiconnect.test`, `driver2@taxiconnect.test`"
            echo "- Conductor account: `conductor@taxiconnect.test`"
            echo "- Sample taxis: Sun City and Rustenburg"
            echo "- Password: supplied through GitHub Actions secret; not displayed."
          } >> "$GITHUB_STEP_SUMMARY"
